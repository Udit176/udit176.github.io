<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>My Liked Songs | Udit Ekansh</title>
  <meta name="description" content="Every song Udit Ekansh has ever liked on Spotify." />
  <link rel="canonical" href="https://udit176.github.io/spotify.html" />
  <meta property="og:title" content="My Liked Songs | Udit Ekansh" />
  <meta property="og:description" content="Every song I've ever liked on Spotify." />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://udit176.github.io/spotify.html" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .spotify-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }

    .song-count {
      color: #666;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 400px;
      padding: 0.6rem 1rem;
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      color: #ddd;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: #1DB954;
    }

    .search-box::placeholder {
      color: #555;
    }

    .sort-btn {
      background: #111;
      border: 1px solid #222;
      color: #999;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .sort-btn:hover {
      color: #ddd;
      border-color: #444;
    }

    .sort-btn.active {
      color: #1DB954;
      border-color: #1DB954;
    }

    .songs-table {
      width: 100%;
      border-collapse: collapse;
    }

    .songs-table thead th {
      text-align: left;
      color: #666;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 0;
      border-bottom: 1px solid #222;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    .songs-table thead th:hover {
      color: #aaa;
    }

    .songs-table thead th.col-num {
      width: 3rem;
      text-align: right;
      padding-right: 1rem;
      cursor: default;
    }

    .songs-table thead th .sort-arrow {
      font-size: 0.7rem;
      margin-left: 0.25rem;
      color: #444;
    }

    .songs-table thead th.sorted .sort-arrow {
      color: #1DB954;
    }

    .songs-table tbody tr {
      border-bottom: 1px solid #111;
      transition: background 0.15s;
    }

    .songs-table tbody tr:hover {
      background: #111;
    }

    .songs-table td {
      padding: 0.5rem 0;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .songs-table td.col-num {
      text-align: right;
      padding-right: 1rem;
      color: #555;
      font-size: 0.85rem;
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .song-art {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      flex-shrink: 0;
      background: #222;
    }

    .song-text .song-name {
      color: #ddd;
      font-weight: 500;
      display: block;
    }

    .song-text .song-name a {
      color: #ddd;
      text-decoration: none;
    }

    .song-text .song-name a:hover {
      color: #1DB954;
      text-decoration: underline;
    }

    .song-text .song-artist {
      color: #777;
      font-size: 0.8rem;
      display: block;
    }

    .td-album {
      color: #777;
      font-size: 0.85rem;
    }

    .td-date {
      color: #555;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .empty-state {
      color: #666;
      text-align: center;
      padding: 3rem 1rem;
      font-size: 1rem;
    }

    .empty-state code {
      background: #111;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.85rem;
      color: #aaa;
    }

    @media (max-width: 768px) {
      .spotify-section {
        padding: 0 1rem 2rem;
      }
      .td-album, .col-album {
        display: none;
      }
      .song-art {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-and-name">
      <span class="site-title">Udit Ekansh</span>
    </div>
    <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#research">Research</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#courses">Courses</a></li>
        <li><a href="index.html#blog">Blog</a></li>
        <li><a href="index.html#misc">Misc</a></li>
        <li><a href="index.html#connect">Connect</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero-section">
    <h1>My Liked Songs</h1>
    <p style="color:#777; font-size:0.9rem;">Every song I've ever liked on Spotify.</p>
  </section>

  <section class="spotify-section">
    <div id="songs-container">
      <p class="empty-state">Loading...</p>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Udit Ekansh. All rights reserved.</p>
  </footer>

  <script>
  document.querySelector(".nav-toggle").addEventListener("click", function() {
    document.querySelector(".main-nav").classList.toggle("open");
  });

  var allSongs = [];
  var currentSort = { key: "added_at", dir: "desc" };

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTable(songs) {
    var container = document.getElementById("songs-container");
    if (!songs.length) {
      container.innerHTML = '<p class="empty-state">No songs found.</p>';
      return;
    }

    var html = "";
    html += '<p class="song-count">' + allSongs.length + " songs</p>";
    html += '<div class="controls">';
    html += '<input type="text" class="search-box" id="search" placeholder="Search songs, artists, albums..." oninput="filterAndRender()">';
    html += "</div>";
    html += '<div style="overflow-x:auto;">';
    html += '<table class="songs-table"><thead><tr>';
    html += '<th class="col-num">#</th>';
    html += buildTh("title", "Title");
    html += buildTh("artist", "Artist");
    html += buildTh("album", "Album", "col-album");
    html += buildTh("added_at", "Added");
    html += "</tr></thead><tbody>";

    for (var i = 0; i < songs.length; i++) {
      var s = songs[i];
      html += "<tr>";
      html += '<td class="col-num">' + (i + 1) + "</td>";
      html += "<td><div class='song-info'>";
      if (s.art) {
        html += '<img class="song-art" src="' + escapeHtml(s.art) + '" alt="" loading="lazy">';
      }
      html += '<div class="song-text">';
      html += '<span class="song-name"><a href="' + escapeHtml(s.url) + '" target="_blank">' + escapeHtml(s.title) + "</a></span>";
      html += '<span class="song-artist">' + escapeHtml(s.artist) + "</span>";
      html += "</div></div></td>";
      html += '<td class="td-album">' + escapeHtml(s.album) + "</td>";
      html += '<td class="td-date">' + (s.added_at ? s.added_at.split("T")[0] : "") + "</td>";
      html += "</tr>";
    }

    html += "</tbody></table></div>";
    container.innerHTML = html;
  }

  function buildTh(key, label, extraClass) {
    var cls = (extraClass || "") + (currentSort.key === key ? " sorted" : "");
    var arrow = "";
    if (currentSort.key === key) {
      arrow = currentSort.dir === "asc" ? " &#9650;" : " &#9660;";
    }
    return '<th class="' + cls.trim() + '" onclick="sortBy(\'' + key + '\')">' + label + '<span class="sort-arrow">' + arrow + "</span></th>";
  }

  function sortBy(key) {
    if (currentSort.key === key) {
      currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
    } else {
      currentSort.key = key;
      currentSort.dir = "asc";
    }
    filterAndRender();
  }

  function filterAndRender() {
    var searchEl = document.getElementById("search");
    var query = searchEl ? searchEl.value.toLowerCase() : "";
    var filtered = allSongs;

    if (query) {
      filtered = allSongs.filter(function(s) {
        return (s.title + " " + s.artist + " " + s.album).toLowerCase().indexOf(query) !== -1;
      });
    }

    filtered = filtered.slice().sort(function(a, b) {
      var va = (a[currentSort.key] || "").toLowerCase();
      var vb = (b[currentSort.key] || "").toLowerCase();
      if (va < vb) return currentSort.dir === "asc" ? -1 : 1;
      if (va > vb) return currentSort.dir === "asc" ? 1 : -1;
      return 0;
    });

    renderTable(filtered);
    if (searchEl) {
      var newSearch = document.getElementById("search");
      newSearch.value = query;
      newSearch.focus();
    }
  }

  fetch("data/spotify_likes.json")
    .then(function(resp) {
      if (!resp.ok) throw new Error("not found");
      return resp.json();
    })
    .then(function(data) {
      allSongs = data.songs;
      filterAndRender();
    })
    .catch(function() {
      document.getElementById("songs-container").innerHTML =
        '<p class="empty-state">No data yet.<br><br>Run the fetch script to populate:<br><code>python scripts/fetch_spotify.py --client-id YOUR_ID</code></p>';
    });
  </script>
</body>
</html>
