<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>My Spotify Liked Songs | Udit Ekansh</title>
  <meta name="description" content="Every song Udit Ekansh has ever liked on Spotify." />
  <link rel="canonical" href="https://udit176.github.io/spotify.html" />
  <meta property="og:title" content="My Spotify Liked Songs | Udit Ekansh" />
  <meta property="og:description" content="Every song I've ever liked on Spotify." />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://udit176.github.io/spotify.html" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .spotify-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }

    .spotify-connect-btn {
      display: inline-block;
      background: #1DB954;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .spotify-connect-btn:hover {
      background: #1ed760;
      transform: scale(1.03);
      color: #000;
    }

    .spotify-status {
      color: #777;
      font-size: 0.9rem;
      margin-top: 1rem;
    }

    .spotify-loading {
      color: #999;
      font-size: 1rem;
      margin: 2rem 0;
    }

    .spotify-loading .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #333;
      border-top-color: #1DB954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .song-count {
      color: #666;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .songs-table {
      width: 100%;
      border-collapse: collapse;
    }

    .songs-table thead th {
      text-align: left;
      color: #666;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 0;
      border-bottom: 1px solid #222;
    }

    .songs-table thead th.col-num {
      width: 3rem;
      text-align: right;
      padding-right: 1rem;
    }

    .songs-table tbody tr {
      border-bottom: 1px solid #111;
      transition: background 0.15s;
    }

    .songs-table tbody tr:hover {
      background: #111;
    }

    .songs-table td {
      padding: 0.5rem 0;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .songs-table td.col-num {
      text-align: right;
      padding-right: 1rem;
      color: #555;
      font-size: 0.85rem;
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .song-art {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      flex-shrink: 0;
      background: #222;
    }

    .song-text .song-name {
      color: #ddd;
      font-weight: 500;
      display: block;
    }

    .song-text .song-name a {
      color: #ddd;
      text-decoration: none;
    }

    .song-text .song-name a:hover {
      color: #1DB954;
      text-decoration: underline;
    }

    .song-text .song-artist {
      color: #777;
      font-size: 0.8rem;
      display: block;
    }

    .td-album {
      color: #777;
      font-size: 0.85rem;
    }

    .td-date {
      color: #555;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .search-box {
      width: 100%;
      max-width: 350px;
      padding: 0.6rem 1rem;
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      color: #ddd;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: #1DB954;
    }

    .search-box::placeholder {
      color: #555;
    }

    @media (max-width: 768px) {
      .spotify-section {
        padding: 0 1rem 2rem;
      }
      .td-album, .col-album, .td-date, .col-date {
        display: none;
      }
      .song-art {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-and-name">
      <span class="site-title">Udit Ekansh</span>
    </div>
    <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#research">Research</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#courses">Courses</a></li>
        <li><a href="index.html#blog">Blog</a></li>
        <li><a href="index.html#misc">Misc</a></li>
        <li><a href="index.html#connect">Connect</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero-section">
    <h1>My Liked Songs</h1>
    <p style="color:#777; font-size:0.9rem;">Every song I've ever liked on Spotify.</p>
  </section>

  <section class="spotify-section">
    <div id="spotify-app">
      <div id="pre-auth">
        <button class="spotify-connect-btn" onclick="login()">Connect to Spotify</button>
        <p class="spotify-status">Connects via Spotify's secure OAuth. No data is stored or sent anywhere.</p>
      </div>
      <div id="loading" style="display:none;">
        <p class="spotify-loading"><span class="spinner"></span> Fetching liked songs...</p>
      </div>
      <div id="songs-container" style="display:none;"></div>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Udit Ekansh. All rights reserved.</p>
  </footer>

  <script>
  document.querySelector(".nav-toggle").addEventListener("click", function() {
    document.querySelector(".main-nav").classList.toggle("open");
  });

  var CLIENT_ID = "YOUR_SPOTIFY_CLIENT_ID";
  var REDIRECT_URI = "https://udit176.github.io/spotify.html";
  var SCOPES = "user-library-read";

  function generateRandomString(length) {
    var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    var arr = new Uint8Array(length);
    crypto.getRandomValues(arr);
    var result = "";
    for (var i = 0; i < length; i++) {
      result += chars[arr[i] % chars.length];
    }
    return result;
  }

  async function generateCodeChallenge(verifier) {
    var encoder = new TextEncoder();
    var data = encoder.encode(verifier);
    var digest = await crypto.subtle.digest("SHA-256", data);
    var bytes = new Uint8Array(digest);
    var str = "";
    for (var i = 0; i < bytes.length; i++) {
      str += String.fromCharCode(bytes[i]);
    }
    return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function login() {
    var verifier = generateRandomString(128);
    var challenge = await generateCodeChallenge(verifier);
    sessionStorage.setItem("spotify_verifier", verifier);

    var params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      code_challenge_method: "S256",
      code_challenge: challenge
    });

    window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
  }

  async function getAccessToken(code) {
    var verifier = sessionStorage.getItem("spotify_verifier");
    var response = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    });
    var data = await response.json();
    return data.access_token;
  }

  async function fetchAllLikedSongs(token) {
    var allSongs = [];
    var url = "https://api.spotify.com/v1/me/tracks?limit=50";

    while (url) {
      var response = await fetch(url, {
        headers: { Authorization: "Bearer " + token }
      });
      var data = await response.json();
      allSongs = allSongs.concat(data.items);
      url = data.next;
    }
    return allSongs;
  }

  function renderSongs(songs) {
    var container = document.getElementById("songs-container");
    var html = "";
    html += '<p class="song-count">' + songs.length + " liked songs</p>";
    html += '<input type="text" class="search-box" id="search" placeholder="Search songs, artists, albums..." oninput="filterSongs()">';
    html += '<div style="overflow-x:auto;">';
    html += '<table class="songs-table"><thead><tr>';
    html += '<th class="col-num">#</th><th>Title</th><th class="col-album">Album</th><th class="col-date">Added</th>';
    html += '</tr></thead><tbody id="songs-body">';

    for (var i = 0; i < songs.length; i++) {
      var track = songs[i].track;
      var added = songs[i].added_at ? songs[i].added_at.split("T")[0] : "";
      var art = track.album.images.length > 2 ? track.album.images[2].url : (track.album.images.length > 0 ? track.album.images[0].url : "");
      var artists = track.artists.map(function(a) { return a.name; }).join(", ");
      var spotifyUrl = track.external_urls.spotify || "#";

      html += '<tr data-search="' + (track.name + " " + artists + " " + track.album.name).toLowerCase().replace(/"/g, "&quot;") + '">';
      html += '<td class="col-num">' + (i + 1) + "</td>";
      html += '<td><div class="song-info">';
      if (art) {
        html += '<img class="song-art" src="' + art + '" alt="" loading="lazy">';
      }
      html += '<div class="song-text">';
      html += '<span class="song-name"><a href="' + spotifyUrl + '" target="_blank">' + escapeHtml(track.name) + "</a></span>";
      html += '<span class="song-artist">' + escapeHtml(artists) + "</span>";
      html += "</div></div></td>";
      html += '<td class="td-album">' + escapeHtml(track.album.name) + "</td>";
      html += '<td class="td-date">' + added + "</td>";
      html += "</tr>";
    }

    html += "</tbody></table></div>";
    container.innerHTML = html;
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function filterSongs() {
    var query = document.getElementById("search").value.toLowerCase();
    var rows = document.querySelectorAll("#songs-body tr");
    var num = 0;
    for (var i = 0; i < rows.length; i++) {
      var match = rows[i].getAttribute("data-search").indexOf(query) !== -1;
      rows[i].style.display = match ? "" : "none";
      if (match) {
        num++;
        rows[i].querySelector(".col-num").textContent = num;
      }
    }
  }

  async function handleCallback() {
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");
    if (!code) return;

    window.history.replaceState({}, document.title, window.location.pathname);

    document.getElementById("pre-auth").style.display = "none";
    document.getElementById("loading").style.display = "block";

    try {
      var token = await getAccessToken(code);
      var songs = await fetchAllLikedSongs(token);
      document.getElementById("loading").style.display = "none";
      document.getElementById("songs-container").style.display = "block";
      renderSongs(songs);
    } catch (e) {
      document.getElementById("loading").innerHTML = '<p style="color:#e55;">Failed to load songs. Please try again.</p>';
    }
  }

  handleCallback();
  </script>
</body>
</html>
